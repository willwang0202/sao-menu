name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit
      - run: node scripts/build-desktop.mjs
      # Original Steam resources are local user data and are not redistributed
      # through CI. Full renderer/package builds require an explicit local import.
