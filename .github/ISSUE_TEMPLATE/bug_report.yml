name: Bug report
description: Report a problem with SAO Menu or its website.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.4 (or website)"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (x64)
        - Linux (x64)
        - Website
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, display and browser
      description: Include OS version. For animation issues, include resolution and refresh rate; for website issues, include browser version.
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the problem. You can drag in screenshots or a recording.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Click…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Additional details or logs
      description: Remove passwords, session tokens and private messages. GitHub reports are public.
